<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Install</title>
<style>body{font:18px -apple-system,system-ui,sans-serif;margin:0;padding:24px 16px;background:#f6f6f8;color:#111}a.b{display:block;background:#2f5bd3;color:#fff;text-align:center;padding:18px;border-radius:14px;text-decoration:none;font-weight:700;margin:16px 0}p{line-height:1.4}.m{opacity:.65;font-size:14px}</style></head><body>
<h2 id="t">Install</h2><a class="b" id="a" href="#" download>Install</a>
<p>Tap the blue button, then <b>Download</b>, then tap the downloaded file and <b>Add Shortcut</b>. Same steps for every shortcut.</p>
<p class="m">Untrusted warning? Settings &gt; Shortcuts &gt; Allow Untrusted Shortcuts, then tap the blue button again.</p>
<script>
var q=new URLSearchParams(location.search),f=q.get('f')||'',n=(q.get('n')||'Family').slice(0,40);
var a=document.getElementById('a');
if(!/^[\w\/. -]+\.shortcut$/.test(f)){document.getElementById('t').textContent='Unknown shortcut';a.style.display='none'}
else{a.href='../shortcuts/'+encodeURI(f);a.setAttribute('download',n+'.shortcut');a.textContent='Install '+n;document.getElementById('t').textContent='Install '+n}
</script></body></html>
