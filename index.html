<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Working…</title>
<style>:root{color-scheme:light dark}body{margin:0;font:19px -apple-system,system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:20px;background:#fafaf7;color:#1d1d1f}
@media(prefers-color-scheme:dark){body{background:#111113;color:#f2f2f4}}a,button{display:block;margin:14px auto;font:inherit;font-weight:700;padding:16px 22px;border-radius:14px;background:#0a6cff;color:#fff;border:0;text-decoration:none}.s{font-size:15px;opacity:.7}[hidden]{display:none}</style></head><body>
<div><div id="m">Working…</div><div class="s" id="s"></div><a id="go" hidden>Open Shortcuts</a><a id="bk" hidden>Back to app</a></div>
<script>
const ART="https://claude.ai/artifact/7GeHGrqt1o3rGeVn6oEZ2G",H=location.hash.slice(1),q=new URLSearchParams(H),$=i=>document.getElementById(i);
const es=(navigator.language||"").startsWith("es");
function sc(name,text){return"shortcuts://run-shortcut?name="+encodeURIComponent(name)+(text?"&input=text&text="+encodeURIComponent(text):"")}
function back(){return ART}
try{history.replaceState(null,"",location.pathname)}catch(e){}
let url=null;
const m=H.match(/^(bill|letter|unpaid|text|r)=([\s\S]*)$/);
if(m){/* fallback: a shortcut that returned here instead of the app: forward the answer */url=ART+"#ai="+(m[1]==="r"?"text":m[1])+"~"+m[2];$("m").textContent=es?"Volviendo…":"Returning…"}
else if(q.get("s")){url=sc(q.get("s"),q.get("x")||(q.get("c")==="1"?"cal":"nocal"))}
else if(q.get("create")){url="shortcuts://create-shortcut"}
else if(q.get("test")){url=sc(q.get("n")||"HH Text","Reply with only: Everything works")}
else{$("m").textContent="";$("bk").hidden=false;$("bk").href=back();$("bk").textContent=es?"Volver a la app":"Back to app"}
if(url){setTimeout(()=>{location.href=url},120);
 setTimeout(()=>{if(!document.hidden){$("s").textContent=es?"Si no pasó nada, pulsa abajo.":"If nothing happened, tap below.";$("go").hidden=false;$("go").href=url;$("go").textContent=es?"Abrir":"Open";$("bk").hidden=false;$("bk").href=back();$("bk").textContent=es?"Volver a la app":"Back to app"}},2500)}
</script></body></html>
